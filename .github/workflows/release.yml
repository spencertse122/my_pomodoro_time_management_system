name: Signed desktop release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semver release version
        required: true
        default: 2.0.0

permissions:
  contents: read

jobs:
  validate-release-inputs:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      UPDATE_FEED_URL: ${{ vars.FOCUS_FLOW_UPDATE_FEED_URL }}
      DIAGNOSTICS_URL: ${{ vars.FOCUS_FLOW_DIAGNOSTICS_URL }}
    steps:
      - name: Validate version and optional endpoint URLs
        shell: bash
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "version must be an exact numeric semantic version such as 2.0.1" >&2
            exit 1
          fi
          for endpoint in "$UPDATE_FEED_URL" "$DIAGNOSTICS_URL"; do
            if [[ -n "$endpoint" && ! "$endpoint" =~ ^https://[^[:space:]]+$ ]]; then
              echo "Configured release endpoints must be absolute HTTPS URLs." >&2
              exit 1
            fi
          done

  macos-arm64:
    needs: validate-release-inputs
    runs-on: [self-hosted, macOS, ARM64]
    env:
      GEMMA_MODEL_SHA256: ${{ secrets.GEMMA_MODEL_SHA256 }}
      GEMMA_MMPROJ_SHA256: ${{ secrets.GEMMA_MMPROJ_SHA256 }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_BUILD_NUMBER: ${{ github.run_number }}
      UPDATE_FEED_URL: ${{ vars.FOCUS_FLOW_UPDATE_FEED_URL }}
      DIAGNOSTICS_URL: ${{ vars.FOCUS_FLOW_DIAGNOSTICS_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
      - run: flutter pub get
      - name: Stage verified Gemma release assets
        env:
          GEMMA_MODEL_URL: ${{ secrets.GEMMA_MODEL_URL }}
          GEMMA_MMPROJ_URL: ${{ secrets.GEMMA_MMPROJ_URL }}
        run: |
          if [[ ! "$GEMMA_MODEL_URL" =~ ^https://[^[:space:]]+$ || ! "$GEMMA_MMPROJ_URL" =~ ^https://[^[:space:]]+$ ]]; then
            echo "Gemma release artifacts must use HTTPS URLs." >&2
            exit 1
          fi
          curl --fail --location "$GEMMA_MODEL_URL" --output assets/models/gemma-3-4b-it-q4_k_m.gguf
          curl --fail --location "$GEMMA_MMPROJ_URL" --output assets/models/mmproj-gemma-3-4b-it-f16.gguf
          dart run tool/verify_models.dart
      - run: dart run build_runner build
      - run: dart format --output=none --set-exit-if-changed lib test integration_test tool
      - run: flutter analyze
      - run: flutter test
      - name: Build Apple Silicon app
        run: |
          flutter build macos --release \
            --build-name="$RELEASE_VERSION" \
            --build-number="$RELEASE_BUILD_NUMBER" \
            --dart-define="FOCUS_FLOW_UPDATE_FEED_URL=$UPDATE_FEED_URL" \
            --dart-define="FOCUS_FLOW_DIAGNOSTICS_URL=$DIAGNOSTICS_URL"
          APP_BINARY="build/macos/Build/Products/Release/Focus Flow.app/Contents/MacOS/Focus Flow"
          file "$APP_BINARY" | grep -q 'arm64'
      - name: Sign, notarize, and package DMG
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          APP_PATH="build/macos/Build/Products/Release/Focus Flow.app"
          DIST_PATH="$RUNNER_TEMP/focus-flow-dist"
          VOLUME_PATH="$RUNNER_TEMP/focus-flow-volume"
          mkdir -p "$DIST_PATH"
          while IFS= read -r -d '' nested_code; do
            codesign --force --options runtime --timestamp \
              --sign "$MACOS_SIGNING_IDENTITY" "$nested_code"
          done < <(
            find "$APP_PATH/Contents/Frameworks" -depth \
              \( -type d -name '*.framework' -o -type f -name '*.dylib' \) \
              -print0
          )
          codesign --force --options runtime --timestamp \
            --entitlements macos/Runner/Release.entitlements \
            --sign "$MACOS_SIGNING_IDENTITY" "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          SIGNED_ENTITLEMENTS="$DIST_PATH/signed-entitlements.plist"
          codesign -d --entitlements :- "$APP_PATH" > "$SIGNED_ENTITLEMENTS"
          /usr/libexec/PlistBuddy -c 'Print :com.apple.security.app-sandbox' "$SIGNED_ENTITLEMENTS" | grep -qx true
          /usr/libexec/PlistBuddy -c 'Print :com.apple.security.network.client' "$SIGNED_ENTITLEMENTS" | grep -qx true
          /usr/libexec/PlistBuddy -c 'Print :keychain-access-groups' "$SIGNED_ENTITLEMENTS" >/dev/null
          mkdir -p "$VOLUME_PATH"
          ditto "$APP_PATH" "$VOLUME_PATH/Focus Flow.app"
          ln -s /Applications "$VOLUME_PATH/Applications"
          DMG_PATH="$DIST_PATH/Focus-Flow-${RELEASE_VERSION}-macos-arm64.dmg"
          hdiutil create -volname "Focus Flow" -srcfolder "$VOLUME_PATH" -ov -format UDZO "$DMG_PATH"
          codesign --force --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$DMG_PATH"
          xcrun notarytool submit "$DMG_PATH" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG_PATH"
      - uses: actions/upload-artifact@v4
        with:
          name: focus-flow-${{ inputs.version }}-macos-arm64
          path: ${{ runner.temp }}/focus-flow-dist/*.dmg
          if-no-files-found: error
      - name: Remove staged model files
        if: always()
        run: |
          rm -f assets/models/gemma-3-4b-it-q4_k_m.gguf
          rm -f assets/models/mmproj-gemma-3-4b-it-f16.gguf

  windows-x64:
    needs: validate-release-inputs
    runs-on: [self-hosted, Windows, X64]
    env:
      GEMMA_MODEL_SHA256: ${{ secrets.GEMMA_MODEL_SHA256 }}
      GEMMA_MMPROJ_SHA256: ${{ secrets.GEMMA_MMPROJ_SHA256 }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_BUILD_NUMBER: ${{ github.run_number }}
      UPDATE_FEED_URL: ${{ vars.FOCUS_FLOW_UPDATE_FEED_URL }}
      DIAGNOSTICS_URL: ${{ vars.FOCUS_FLOW_DIAGNOSTICS_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
      - run: flutter pub get
      - name: Stage verified Gemma release assets
        shell: pwsh
        env:
          GEMMA_MODEL_URL: ${{ secrets.GEMMA_MODEL_URL }}
          GEMMA_MMPROJ_URL: ${{ secrets.GEMMA_MMPROJ_URL }}
        run: |
          if ($env:GEMMA_MODEL_URL -notmatch '^https://\S+$' -or $env:GEMMA_MMPROJ_URL -notmatch '^https://\S+$') {
            throw 'Gemma release artifacts must use HTTPS URLs.'
          }
          Invoke-WebRequest -Uri $env:GEMMA_MODEL_URL -OutFile assets/models/gemma-3-4b-it-q4_k_m.gguf
          Invoke-WebRequest -Uri $env:GEMMA_MMPROJ_URL -OutFile assets/models/mmproj-gemma-3-4b-it-f16.gguf
          dart run tool/verify_models.dart
          if ($LASTEXITCODE -ne 0) { throw 'Gemma model verification failed.' }
      - run: dart run build_runner build
      - run: dart format --output=none --set-exit-if-changed lib test integration_test tool
      - run: flutter analyze
      - run: flutter test
      - name: Build Windows x64 application
        shell: pwsh
        run: |
          flutter build windows --release `
            --build-name="$env:RELEASE_VERSION" `
            --build-number="$env:RELEASE_BUILD_NUMBER" `
            --dart-define="FOCUS_FLOW_UPDATE_FEED_URL=$env:UPDATE_FEED_URL" `
            --dart-define="FOCUS_FLOW_DIAGNOSTICS_URL=$env:DIAGNOSTICS_URL"
          if ($LASTEXITCODE -ne 0) { throw 'Windows release build failed.' }
      - name: Import signing certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          New-Item -ItemType Directory -Force release-secrets | Out-Null
          [IO.File]::WriteAllBytes('release-secrets/windows-signing.pfx', [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX))
      - name: Sign executable and build signed installer
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $releaseRoot = 'build/windows/x64/runner/Release'
          if (-not (Test-Path "$releaseRoot/FocusFlow.exe")) {
            throw 'The expected FocusFlow.exe release binary is missing.'
          }
          $binaries = @(Get-ChildItem $releaseRoot -Recurse -File |
            Where-Object { $_.Extension -in '.exe', '.dll' })
          foreach ($binary in $binaries) {
            & packaging/windows/sign-file.cmd $binary.FullName
            if ($LASTEXITCODE -ne 0) { throw "Signing failed for $($binary.FullName)." }
            signtool.exe verify /pa /all $binary.FullName
            if ($LASTEXITCODE -ne 0) { throw "Signature verification failed for $($binary.FullName)." }
          }
          $env:PATH = "C:\Program Files (x86)\Inno Setup 6;$env:PATH"
          $signTool = '/SFocusFlowSignTool=cmd.exe /D /S /C $q$q' +
            "$env:GITHUB_WORKSPACE\packaging\windows\sign-file.cmd" + '$q $f$q'
          ISCC.exe "/DMyAppVersion=$env:RELEASE_VERSION" $signTool packaging/windows/FocusFlow.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed.' }
          $installer = "dist/Focus-Flow-$env:RELEASE_VERSION-windows-x64-setup.exe"
          signtool.exe verify /pa /all $installer
          if ($LASTEXITCODE -ne 0) { throw 'Installer signature verification failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: focus-flow-${{ inputs.version }}-windows-x64
          path: dist/*.exe
          if-no-files-found: error
      - name: Remove staged signing and model files
        if: always()
        shell: pwsh
        run: |
          Remove-Item -Force -ErrorAction SilentlyContinue release-secrets/windows-signing.pfx
          Remove-Item -Force -ErrorAction SilentlyContinue assets/models/gemma-3-4b-it-q4_k_m.gguf
          Remove-Item -Force -ErrorAction SilentlyContinue assets/models/mmproj-gemma-3-4b-it-f16.gguf
